<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plugin & Sample Explorer</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.6);
            --card-hover: rgba(51, 65, 85, 0.8);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(30, 41, 59, 0.8);
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-hover: rgba(241, 245, 249, 1);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 7rem; }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1rem; background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 1.1rem; font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .container { max-width: 1000px; margin: 1rem auto; padding: 0 0.8rem; }

        .controls-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .search-box { position: relative; flex-grow: 1; }
        .search-box input {
            width: 100%; padding: 0.75rem 0.8rem 0.75rem 2.4rem;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-main); font-size: 0.9rem; outline: none;
        }
        .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

        .breadcrumb {
            display: flex; align-items: center; gap: 0.4rem;
            background: var(--card-bg); padding: 0.6rem 0.9rem;
            border-radius: 12px; margin-bottom: 1.2rem; border: 1px solid var(--border-color);
            font-size: 0.85rem; flex-wrap: wrap;
        }
        .crumb-item { color: #38bdf8; cursor: pointer; font-weight: 600; }
        .crumb-current { color: var(--text-main); font-weight: 700; }

        .explorer-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .item-row {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 0.8rem 1rem; display: flex;
            align-items: center; justify-content: space-between; cursor: pointer;
        }
        .item-row:hover { background: var(--card-hover); }

        .item-info { display: flex; align-items: center; gap: 0.6rem; flex-grow: 1; min-width: 0; }
        .item-checkbox { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .item-icon {
            width: 38px; height: 38px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
        }
        .folder-icon { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .audio-icon { background: rgba(14, 165, 233, 0.15); color: #0ea5e9; }
        .file-icon { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

        .item-details { min-width: 0; flex-grow: 1; }
        .item-details h4 { font-size: 0.9rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-details p { font-size: 0.75rem; color: var(--text-sub); }

        .action-area { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
        .btn-action {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-color);
            color: #38bdf8; padding: 0.4rem 0.7rem; border-radius: 8px;
            cursor: pointer; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem;
        }
        .btn-download { background: linear-gradient(90deg, #06b6d4, #3b82f6); color: white; border: none; }

        .loading-box { text-align: center; padding: 2.5rem 1rem; color: #38bdf8; }

        /* Floating Audio Player */
        .bottom-player {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0f172a; border-top: 2px solid #38bdf8;
            padding: 0.8rem 1rem; display: none; flex-direction: column; gap: 0.5rem; z-index: 999;
        }
        .player-header { display: flex; justify-content: space-between; align-items: center; }
        .player-title { font-size: 0.85rem; color: #f8fafc; font-weight: 600; }
        .audio-element { width: 100%; height: 36px; }

        .batch-bar {
            position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%);
            background: #38bdf8; color: #0f172a; padding: 0.6rem 1.2rem;
            border-radius: 30px; display: none; align-items: center; gap: 0.8rem;
            font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 998;
        }
        .batch-btn { background: #0f172a; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand-title"><i class="fa-solid fa-folder-tree"></i> Drive Explorer</div>
    </div>

    <div class="container">
        <div class="controls-row">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="Rechercher...">
            </div>
            <button onclick="refreshFolder()" class="btn-action"><i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="explorer-list" id="explorerContainer"></div>
    </div>

    <!-- Direct Play Player -->
    <div class="bottom-player" id="bottomPlayer">
        <div class="player-header">
            <span class="player-title" id="playerTrackTitle">Track Title</span>
            <button class="btn-action" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <audio id="mainAudioElement" class="audio-element" controls autoplay></audio>
    </div>

    <!-- Selection Bar -->
    <div class="batch-bar" id="batchBar">
        <span id="selectedCount">0 sélectionné(s)</span>
        <button class="batch-btn" onclick="downloadSelected()">Telecharger (Maro)</button>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4hIL73CM7Jnh2PYO5AMKXqSd6x3OchVLd7_Wi2Z4875uakmFV5W3wfTJZllhN8aW6/exec";
        const ROOT_FOLDER_ID = "103j27ePcTXWV4uHhJYyYXyK1CJBuDYKY";
        
        let folderHistory = [{ id: ROOT_FOLDER_ID, name: "Accueil" }];
        let currentItems = [];
        let selectedItems = new Map();

        function loadFolder(folderId) {
            const container = document.getElementById('explorerContainer');
            container.innerHTML = `<div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>`;
            selectedItems.clear();
            updateBatchBar();

            fetch(`${APPS_SCRIPT_URL}?folderId=${folderId}`)
            .then(res => res.json())
            .then(data => {
                currentItems = data.items || [];
                renderItems(currentItems);
                renderBreadcrumb();
            });
        }

        function renderItems(items) {
            const container = document.getElementById('explorerContainer');
            if (!items || items.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding: 2rem; color: var(--text-sub);">Empty folder.</p>`;
                return;
            }
            container.innerHTML = '';

            items.forEach(item => {
                const isAudio = item.name.match(/\.(mp3|wav|ogg|m4a|flac)$/i);
                const iconClass = item.isFolder ? "folder-icon" : (isAudio ? "audio-icon" : "file-icon");
                const iconSymbol = item.isFolder ? "fa-folder" : (isAudio ? "fa-music" : "fa-file");

                const downloadUrl = item.isFolder 
                    ? `https://drive.google.com/drive/folders/${item.id}` 
                    : `https://drive.google.com/uc?export=download&id=${item.id}`;

                let audioPlayBtn = (!item.isFolder && isAudio) ? `
                    <button class="btn-action" onclick="playAudioDirect('${item.id}', '${escapeQuotes(item.name)}', event)">
                        <i class="fa-solid fa-play"></i> Play
                    </button>
                ` : '';

                container.innerHTML += `
                    <div class="item-row" onclick="${item.isFolder ? `openSubfolder('${item.id}', '${escapeQuotes(item.name)}')` : ''}">
                        <div class="item-info">
                            <input type="checkbox" class="item-checkbox" onclick="toggleSelect('${item.id}', '${downloadUrl}', event)">
                            <div class="item-icon ${iconClass}"><i class="fa-solid ${iconSymbol}"></i></div>
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <p>${item.isFolder ? 'Dossier' : item.size}</p>
                            </div>
                        </div>
                        <div class="action-area">
                            ${audioPlayBtn}
                            <a href="${downloadUrl}" class="btn-action btn-download" target="_blank" onclick="event.stopPropagation();">
                                <i class="fa-solid fa-download"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        /* Direct Play Audio using Google Drive Direct CDN stream */
        function playAudioDirect(id, title, event) {
            event.stopPropagation();
            const player = document.getElementById('bottomPlayer');
            const audio = document.getElementById('mainAudioElement');
            const titleEl = document.getElementById('playerTrackTitle');

            // Direct stream URL format bypassing CORS/Redirects
            audio.src = `https://lh3.googleusercontent.com/d/${id}`;
            titleEl.innerText = title;
            player.style.display = 'flex';
            audio.play();
        }

        function closePlayer() {
            document.getElementById('mainAudioElement').pause();
            document.getElementById('bottomPlayer').style.display = 'none';
        }

        function toggleSelect(id, url, event) {
            event.stopPropagation();
            if (event.target.checked) selectedItems.set(id, url);
            else selectedItems.delete(id);
            updateBatchBar();
        }

        function updateBatchBar() {
            const bar = document.getElementById('batchBar');
            document.getElementById('selectedCount').innerText = `${selectedItems.size} sélectionné(s)`;
            bar.style.display = selectedItems.size > 0 ? 'flex' : 'none';
        }

        /* Download All Selected Sequentially */
        function downloadSelected() {
            let delay = 0;
            selectedItems.forEach((url) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.click();
                }, delay);
                delay += 1000; // 1 second gap per item to trick popup blocker
            });
        }

        function openSubfolder(id, name) { folderHistory.push({ id: id, name: name }); loadFolder(id); }
        function refreshFolder() { loadFolder(folderHistory[folderHistory.length - 1].id); }

        function renderBreadcrumb() {
            const breadcrumbEl = document.getElementById('breadcrumb');
            breadcrumbEl.innerHTML = '';
            folderHistory.forEach((crumb, index) => {
                if (index === folderHistory.length - 1) {
                    breadcrumbEl.innerHTML += `<span class="crumb-current">${crumb.name}</span>`;
                } else {
                    breadcrumbEl.innerHTML += `<span class="crumb-item" onclick="navigateToFolder(${index})">${crumb.name}</span> / `;
                }
            });
        }

        function navigateToFolder(index) {
            folderHistory = folderHistory.slice(0, index + 1);
            loadFolder(folderHistory[folderHistory.length - 1].id);
        }

        function filterItems() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            renderItems(currentItems.filter(i => i.name.toLowerCase().includes(term)));
        }

        function escapeQuotes(str) { return str.replace(/'/g, "\\'"); }

        loadFolder(ROOT_FOLDER_ID);
    </script>
</body>
</html>
