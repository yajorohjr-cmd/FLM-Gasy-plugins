const f=it.isFolder,k=f?(it.locked?[0,'fa-solid fa-lock','lc']:[0,'fa-solid fa-folder','fl']):kind(it.name);
return `<div class="row${f?' fold':''}" data-x="${i}"${f?' tabindex="0" role="button"':''}>
<div class="inf">${f?'':`<input type="checkbox" class="ck" data-a="ck"${st.sel.has(it.id)?' checked':''}>`}
<div class="ic ${k[2]}"><i class="${k[1]}"></i></div>
<div class="dt"><h4>${esc(it.name)}</h4><p>${f?(it.locked?t.prot:t.folder):t.size+esc(sz(it))}</p></div></div>
<div class="act">${!f&&k[2]==='au'?`<button class="btn" data-a="play"><i class="fa-solid fa-play"></i> ${t.play}</button>`:''}${f?'<i class="fa-solid fa-chevron-right ch"></i>':`<button class="btn" data-a="share" title="${t.share}"><i class="fa-solid fa-share-nodes"></i></button><a class="btn dlb" href="${esc(dlUrl(it.id))}" target="_blank" rel="noopener" data-a="dl"><i class="fa-solid fa-download"></i> ${t.dl}</a>`}</div></div>`}
function chunk(){const L=$('#list'),m=L.querySelector('.more');if(m)m.remove();const e=Math.min(st.shown+60,st.view.length);let h='';for(let i=st.shown;i<e;i++)h+=row(st.view[i],i);st.shown=e;if(e<st.view.length)h+=`<button class="btn more" data-a="more">${t.more} (${st.view.length-e})</button>`;L.insertAdjacentHTML('beforeend',h)}
function filter(){const q=norm($('#q').value.trim());st.view=q?st.items.filter(x=>norm(x.name).includes(q)):st.items;st.shown=0;$('#list').innerHTML='';const nf=st.items.filter(x=>x.isFolder).length;$('#meta').textContent=st.items.length?`${nf} ${t.nf} · ${st.items.length-nf} ${t.nfi}`:'';if(!st.view.length){$('#list').innerHTML=`<div class="msg"><i class="fa-solid fa-box-open"></i><p>${t.empty}</p></div>`;return}chunk()}
function setItems(a){st.items=a.slice().sort((x,y)=>(!!y.isFolder-!!x.isFolder)||String(x.name).localeCompare(String(y.name),undefined,{numeric:true,sensitivity:'base'}));filter()}
const fail=m=>{$('#list').innerHTML=`<div class="msg err"><i class="fa-solid fa-triangle-exclamation"></i><p>${m}</p><button class="btn" data-a="retry"><i class="fa-solid fa-rotate-right"></i> ${t.retry}</button></div>`};

async function load(force){
const cur=st.path[st.path.length-1];
st.sel.clear();bar();drawCrumbs();st.items=[];st.view=[];$('#q').value='';$('#meta').textContent='';
if(ctl){ctl.abort();ctl=null}
const c=cache.get(cur.id);
if(c&&!force&&Date.now()-c.t<3e5){setItems(c.items);return}
$('#list').innerHTML='<div class="row sk"></div>'.repeat(6);
const my=ctl=new AbortController(),to=setTimeout(()=>my.abort(),25000);
try{
const r=await fetch(`${APPS_SCRIPT_URL}?folderId=${encodeURIComponent(cur.id)}${force?'&refresh=1':''}${tok()}`,{redirect:'follow',signal:my.signal});
const d=await r.json();
if(my!==ctl)return;
if(d.error==='locked_folder'){ls.set('flm_vt','');toast(t.expired,1);st.path=[st.path[0]];load();showCode();return}
if(d.error==='forbidden'||d.error==='invalid_folder'){if(cur.id!==ROOT_FOLDER_ID){toast(t.forb,1);st.path=[st.path[0]];return load()}throw 0}
if(d.error||!Array.isArray(d.items))throw 0;
cache.set(cur.id,{items:d.items,t:Date.now()});setItems(d.items);if(force)toast(t.refd)
}catch(e){
if(my!==ctl)return;
fail(e&&e.name==='AbortError'?t.tmo:(e instanceof TypeError||!navigator.onLine)?t.net:t.srv)
}finally{clearTimeout(to)}}

function go(p){st.path=p;load()}
function openF(it){if(it.locked)return openLocked(it);go(st.path.concat({id:it.id,name:it.name}));addRecent()}
function up(){if(st.path.length>1)go(st.path.slice(0,-1))}
function play(it){$('#an').textContent=it.name;$('#af').src=pvUrl(it.id);$('#ao').href=pvUrl(it.id);$('#aud').hidden=false}
function closeM(){$$('.ov').forEach(o=>o.hidden=true);$('#af').src='about:blank'}
async function share(it){const u=dlUrl(it.id);try{if(navigator.share){await navigator.share({title:it.name,url:u});return}}catch(e){if(e&&e.name==='AbortError')return}
try{await navigator.clipboard.writeText(u)}catch(e){const x=document.createElement('textarea');x.value=u;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}
toast(t.copied)}
function dlAll(){const ids=[...st.sel];if(!ids.length)return;let n=0;(function next(){if(n>=ids.length){toast(t.done);return}toast(`${t.dling} ${n+1}/${ids.length}…`);const f=document.createElement('iframe');f.hidden=true;f.src=dlUrl(ids[n++]);document.body.appendChild(f);setTimeout(()=>f.remove(),6e4);setTimeout(next,1200)})()}

$('#list').addEventListener('click',e=>{
const a=e.target.closest('[data-a]'),k=a&&a.dataset.a;
if(k==='more')return chunk();
if(k==='retry')return load(true);
const r=e.target.closest('.row[data-x]');if(!r)return;
const it=st.view[+r.dataset.x];if(!it)return;
if(k==='ck'){a.checked?st.sel.add(it.id):st.sel.delete(it.id);return bar()}
if(k==='dl')return;
if(k==='play')return play(it);
if(k==='share')return share(it);
if(it.isFolder)openF(it)});
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('fold')){const it=st.view[+e.target.dataset.x];if(it)openF(it)}});
$('#crumbs').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)go(st.path.slice(0,+b.dataset.k+1))});
$('#rec').addEventListener('click',e=>{const b=e.target.closest('[data-r]'),r=b&&recents()[+b.dataset.r];if(r)go(r.path.map(p=>({id:p.id,name:p.name})))});
$('.bn').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const g=b.dataset.go;if(g==='home')go([st.path[0]]);else if(g==='up')up();else if(g==='find'){$('#q').focus();scrollTo({top:0,behavior:'smooth'})}else load(true)});
$$('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))closeM()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#tb').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
$('#lb').onclick=()=>setLang(lang==='fr'?'en':'fr');
$('#db').onclick=()=>{$('#dev').hidden=false};
$('#rf').onclick=()=>load(true);
$('#dla').onclick=dlAll;
$('#clr').onclick=()=>{st.sel.clear();$$('.ck').forEach(c=>c.checked=false);bar()};
$('#q').addEventListener('input',()=>{clearTimeout(sd);sd=setTimeout(()=>{if(st.items.length)filter()},120)});
addEventListener('offline',()=>toast(t.net,1));
let pend="ATO",at="";
const tok=()=>st.path.some(p=>p.id===ATO_ALIAS)?'&token='+encodeURIComponent(ls.get('flm_vt','')):'';
const api=p=>fetch(APPS_SCRIPT_URL+'?'+new URLSearchParams(p),{redirect:'follow'}).then(r=>r.json()).catch(()=>({error:'net'}));
const em=d=>{const e=d&&d.error;return d&&d.items?t.old:e==='bad_code'?t.badcode:e==='bad_password'?t.badpw:e==='locked'?t.locked:e==='net'?t.net:t.srv};
async function copy(s){try{await navigator.clipboard.writeText(s)}catch(e){const x=document.createElement('textarea');x.value=s;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}}
function showCode(n){pend=n||'ATO';$('#cin').value='';$('#cerr').textContent='';$('#cod').hidden=false;setTimeout(()=>$('#cin').focus(),50)}
function openLocked(it){if(ls.get('flm_vt',''))go(st.path.concat({id:ATO_ALIAS,name:it.name}));else showCode(it.name)}
async function redeem(){const v=$('#cin').value.trim();if(!v)return;$('#cerr').textContent='';const d=await api({action:'redeem',code:v});if(d.ok){ls.set('flm_vt',d.token);closeM();go(st.path.concat({id:ATO_ALIAS,name:pend}))}else $('#cerr').textContent=em(d)}
function aPaint(s){$('#a1').hidden=true;$('#a2').hidden=false;$('#a2err').textContent='';$('#acode').textContent=s.active?s.code:'— — — —';$('#ast').textContent=s.active?t.active:s.used?t.used:t.none}
function aOut(m){at='';$('#a2').hidden=true;$('#a1').hidden=false;$('#aerr').textContent=m||''}
async function aLogin(){const pw=$('#apw').value;if(!pw)return;$('#aerr').textContent='';const d=await api({action:'adminLogin',pw});if(d.ok){at=d.token;$('#apw').value='';aPaint(d.status)}else $('#aerr').textContent=em(d)}
async function aGen(){const d=await api({action:'adminGen',at});if(d.error)return aOut(t.sess);aPaint(d);toast(t.gend)}
$('#ab').onclick=async()=>{$('#dev').hidden=true;$('#adm').hidden=false;if(at){const d=await api({action:'adminStatus',at});if(d.error)aOut(t.sess);else aPaint(d)}else{aOut();$('#apw').focus()}};
$('#alg').onclick=aLogin;$('#agn').onclick=aGen;$('#cgo').onclick=redeem;
$('#acp').onclick=async()=>{const c=$('#acode').textContent;if(/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(c)){await copy(c);toast(t.ccop)}};
$('#cin').addEventListener('keydown',e=>{if(e.key==='Enter')redeem()});
$('#apw').addEventListener('keydown',e=>{if(e.key==='Enter')aLogin()});

setTheme(document.documentElement.dataset.theme||'dark');
setLang(ls.get('flm_lang','fr')==='en'?'en':'fr');
drawRecent();
load();
</script>
</body>
</html>
